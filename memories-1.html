<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0d0820;--card:#1a1240;--ink:#fff;--mut:#bdb3ee;--a:#ff4fd8;--b:#6ce0ff;--c:#ffd84f;--serif:"Playfair Display",Georgia,serif;--sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:70vmax;height:70vmax;border-radius:50%;filter:blur(40px);z-index:0;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
body::before{left:-30vmax;top:-30vmax;background:radial-gradient(circle,#7a3bff77,transparent 60%)}
body::after{right:-30vmax;bottom:-30vmax;background:radial-gradient(circle,#ff4fd855,transparent 60%);animation-duration:24s}
@keyframes drift{to{transform:translate(25vmax,18vmax) scale(1.2)}}
main{position:relative;z-index:1}
section{max-width:960px;margin:0 auto;padding:70px 18px}
h2{font-family:var(--serif);font-size:clamp(1.8rem,6vw,2.8rem);text-align:center;margin:0 0 6px}
.kick{text-align:center;color:var(--mut);margin:0 0 34px}
/* hero */
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;padding-top:40px}
.hero .t1{letter-spacing:6px;text-transform:uppercase;color:var(--mut);font-size:.85rem}
.hero h1{font-family:var(--serif);font-size:clamp(3rem,15vw,8rem);line-height:1;margin:10px 0;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite;filter:drop-shadow(0 0 24px #ff4fd877)}
.hero h1 em{display:block;font-size:.55em}
@keyframes sh{to{background-position:250% center}}
.btn{border:0;font:inherit;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--a),#a56bff);padding:14px 26px;border-radius:50px;cursor:pointer;box-shadow:0 8px 28px #ff4fd855;transition:transform .15s}
.btn:hover{transform:translateY(-3px) scale(1.04)}.btn:active{transform:scale(.96)}
.cue{margin-top:46px;color:var(--mut);animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(10px)}}
.fl{position:fixed;bottom:-60px;z-index:0;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:.15}}
/* marquee */
.mq{overflow:hidden;border-block:1px solid #ffffff22;background:#ffffff08;padding:14px 0;transform:rotate(-1.5deg);margin:10px 0}
.mq div{display:flex;width:max-content;animation:mq 22s linear infinite;font-family:var(--serif);font-size:1.5rem;font-style:italic;color:var(--c)}
.mq span{padding:0 22px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.st{background:#ffffff0d;border:1px solid #ffffff22;border-radius:20px;padding:20px 8px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.st b{display:block;font-family:var(--serif);font-size:clamp(1.8rem,8vw,3rem);color:var(--b)}
.st span{color:var(--mut);font-size:.8rem}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.gal{grid-template-columns:repeat(3,1fr)}}
.ph{position:relative;background:#fff;padding:8px 8px 30px;border-radius:6px;box-shadow:0 12px 30px #0009;transition:transform .3s;cursor:zoom-in;color:#222;font-size:.85rem;text-align:center}
.ph:nth-child(odd){transform:rotate(-2.5deg)}.ph:nth-child(even){transform:rotate(2.5deg) translateY(14px)}
.ph:hover{transform:scale(1.07) rotate(0)!important;z-index:3}
.ph .im{aspect-ratio:1;display:grid;place-items:center;font-size:2.6rem;overflow:hidden;margin-bottom:8px}
.ph .im img{width:100%;height:100%;object-fit:cover}
.lb{position:fixed;inset:0;z-index:20;background:#000d;display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.on{display:grid}.lb .ph{max-width:420px;width:100%;transform:none!important;cursor:zoom-out}
/* timeline */
.tl{position:relative;padding-left:26px;border-left:2px solid #ff4fd855;margin-left:8px}
.mem{position:relative;background:#ffffff0d;border:1px solid #ffffff22;border-radius:20px;padding:18px;margin-bottom:26px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mem::before{content:"";position:absolute;left:-36px;top:22px;width:18px;height:18px;border-radius:50%;background:var(--a);box-shadow:0 0 16px var(--a)}
.mem small{color:var(--c);letter-spacing:2px;text-transform:uppercase}
.mem h3{font-family:var(--serif);margin:4px 0 6px;font-size:1.4rem}
.mem p{margin:0;color:var(--mut);line-height:1.6}
.rv{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
/* envelope */
.env{max-width:420px;margin:0 auto;position:relative;height:260px;cursor:pointer}
.env .bk{position:absolute;inset:60px 0 0;background:linear-gradient(135deg,#ff7be0,#a56bff);border-radius:12px;box-shadow:0 20px 50px #ff4fd844}
.env .fp{position:absolute;left:0;right:0;top:60px;height:110px;background:linear-gradient(#ff9be8,#d36bff);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s,z-index .6s;z-index:3}
.env .lt{position:absolute;left:14px;right:14px;top:70px;height:170px;background:#fffdf5;color:#333;border-radius:8px;padding:18px;overflow:auto;transition:transform .8s .3s,height .8s .3s;z-index:2;font-family:var(--serif);font-style:italic;line-height:1.55}
.env .fr{position:absolute;inset:60px 0 0;border-radius:12px;background:linear-gradient(160deg,#ff8de6,#9a62ff);clip-path:polygon(0 100%,0 40%,50% 75%,100% 40%,100% 100%);z-index:4}
.env.open .fp{transform:rotateX(180deg);z-index:1}
.env.open .lt{transform:translateY(-70px);height:230px}
.hint{text-align:center;color:var(--mut);margin-top:14px}
footer{text-align:center;padding:50px 18px 70px;color:var(--mut)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:30}
.sp{position:fixed;pointer-events:none;z-index:25;animation:sp .8s forwards}
@keyframes sp{to{transform:translateY(24px) scale(.2) rotate(90deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.hero{overflow:hidden}.hero>div{position:relative;z-index:1}
#pf{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));z-index:40;box-shadow:0 0 12px var(--a)}
#glow{position:fixed;width:280px;height:280px;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,#ff4fd844,transparent 65%);transform:translate(-50%,-50%);left:-999px;top:-999px;mix-blend-mode:screen}
.scn{width:110px;height:110px;perspective:600px;margin:0 auto 22px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
.cube div{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;background:#ffffff14;border:2px solid #ff4fd8aa;border-radius:14px;box-shadow:inset 0 0 24px #ff4fd855}
.cube div:nth-child(1){transform:translateZ(55px)}.cube div:nth-child(2){transform:rotateY(90deg) translateZ(55px)}.cube div:nth-child(3){transform:rotateY(180deg) translateZ(55px)}
.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(55px)}.cube div:nth-child(5){transform:rotateX(90deg) translateZ(55px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(55px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
.clk{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.clk{grid-template-columns:repeat(4,1fr)}}
.clk div{background:#ffffff0d;border:1px solid #ffffff22;border-radius:20px;padding:18px 8px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.clk b{display:block;font-family:var(--serif);font-size:clamp(1.3rem,6vw,2.1rem);color:var(--c);font-variant-numeric:tabular-nums}
.clk span{color:var(--mut);font-size:.8rem}
.btn.alt{background:#2c2260;box-shadow:none;margin-left:8px}
</style>
</head>
<body>
<div id="bar"></div><div id="glow"></div>
<canvas id="cv"></canvas>
<main>
  <section class="hero">
    <canvas id="pf"></canvas>
    <div>
      <div class="scn"><div class="cube"><div>🎂</div><div>🎁</div><div>🎈</div><div>🎉</div><div>💖</div><div>✨</div></div></div>
      <div class="t1">Today is all about</div>
      <h1 id="nm"></h1>
      <p style="color:var(--mut);margin:0 0 24px" id="tag"></p>
      <button class="btn" id="cel">🎉 Celebrate</button><button class="btn alt" id="song">🎵 Play song</button>
      <div class="cue">scroll for memories ↓</div>
    </div>
  </section>
  <div class="mq"><div id="mq"></div></div>
  <section><h2 class="rv">Your life, ticking</h2><p class="kick rv">A live counter since the day you arrived</p><div class="clk" id="clk"></div></section>
  <section><h2 class="rv">Picture perfect</h2><p class="kick rv">Tap a photo to zoom in</p><div class="gal" id="gal"></div></section>
  <section><h2 class="rv">A letter for you</h2><p class="kick rv">Tap the envelope</p>
    <div class="env" id="env"><div class="bk"></div><div class="lt" id="lt"></div><div class="fp"></div><div class="fr"></div></div>
    <p class="hint">💌 Tap to open</p></section>
</main>
<footer><button class="btn" id="wish">🎂 Make a wish</button><p id="by"></p></footer>
<div class="lb" id="lb"></div>

const LETTER = "Dear "+NAME+",<br><br>Thank you for every laugh, every random plan and every day you made better. I hope this year is full of wins, good food and zero stress. You deserve all of it.<br><br>Happy Birthday! 🎉";

const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n);
$('#nm').innerHTML='Happy Birthday<em>'+NAME+'</em>';$('#tag').textContent=TAGLINE;$('#lt').innerHTML=LETTER;$('#by').textContent='Made with ❤️ by '+FROM;
$('#mq').innerHTML=Array(2).fill('<span>Happy Birthday '+NAME+'</span><span>✦</span><span>Make it a great one</span><span>✦</span>'.repeat(4)).join('');
const n=PHOTOS.length||6,hue=i=>`linear-gradient(135deg,hsl(${(i*55)%360} 90% 82%),hsl(${(i*55+60)%360} 90% 75%))`;
$('#gal').innerHTML=Array.from({length:n},(_,i)=>PHOTOS[i]?`<div class="ph rv"><div class="im"><img src="${PHOTOS[i].src}" alt=""></div>${PHOTOS[i].cap||''}</div>`:`<div class="ph rv"><div class="im" style="background:${hue(i)}">📸</div>Your photo here</div>`).join('');
// reveal + counters
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');io.unobserve(e.target);if(e.target.tagName==="H2")scr(e.target);
  const b=e.target.querySelector('[data-n]');if(b){const T=+b.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1500);b.textContent=Math.round(T*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
// lightbox
const lb=$('#lb');document.querySelectorAll('.ph').forEach(p=>p.onclick=()=>{lb.innerHTML=p.outerHTML;lb.firstChild.classList.add('in');lb.classList.add('on')});lb.onclick=()=>lb.classList.remove('on');
// envelope
$('#env').onclick=()=>{$('#env').classList.toggle('open');if($('#env').classList.contains('open'))burst(80)};
// floating emojis
setInterval(()=>{const e=document.createElement('div');e.className='fl';e.textContent=['🎈','🎂','🎉','✨','💖','🎁'][rnd(6)];e.style.left=rnd(95)+'vw';e.style.fontSize=(1.2+Math.random()*1.6)+'rem';e.style.animationDuration=(8+rnd(8))+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),16000)},900);
// sparkles
let lastS=0;addEventListener('pointermove',e=>{const t=performance.now();if(t-lastS<60)return;lastS=t;const s=document.createElement('div');s.className='sp';s.textContent='✨';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),800)});
// confetti
const cv=$('#cv'),cx=cv.getContext('2d');let ps=[],run=false;
const size=()=>{cv.width=innerWidth;cv.height=innerHeight};size();addEventListener('resize',size);
function burst(k){for(let i=0;i<k;i++)ps.push({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,r:Math.random()*6+3,c:`hsl(${rnd(360)},90%,60%)`,l:130});if(!run){run=true;tick()}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=(p.g??.35);p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});if(ps.length)requestAnimationFrame(tick);else run=false}
$('#cel').onclick=()=>burst(160);$('#wish').onclick=()=>{burst(220);$('#wish').textContent='✨ Wish made! ✨'};
setTimeout(()=>burst(120),600);

// scramble headings
function scr(el){const t=el.textContent,ch='!<>-_/[]{}=+*^?#';let i=0;const iv=setInterval(()=>{el.textContent=t.split('').map((c,k)=>k<i||c===' '?c:ch[rnd(ch.length)]).join('');if(i++>=t.length){clearInterval(iv);el.textContent=t}},40)}
// scroll bar + cursor glow
addEventListener('scroll',()=>{$('#bar').style.width=(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)*100)+'%'});
addEventListener('pointermove',e=>{const g=$('#glow');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'});
// 3D tilt cards
document.querySelectorAll('.mem,.st').forEach(c=>{c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transition='transform .1s';c.style.transform=`perspective(600px) rotateY(${x*14}deg) rotateX(${-y*14}deg)`});c.addEventListener('pointerleave',()=>{c.style.transform='';c.style.transition=''})});
// fireworks on tap
function fire(x,y){const h=rnd(360);for(let i=0;i<60;i++){const a=Math.random()*6.28,v=Math.random()*7+2;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3,c:`hsl(${h+rnd(40)},95%,62%)`,l:70,g:.12})}if(!run){run=true;tick()}}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,.env,.ph,.lb'))fire(e.clientX,e.clientY)});
// interactive particle field
const pf=$('#pf'),pc=pf.getContext('2d');let pts=[],mx=-999,my=-999;
function psz(){pf.width=pf.offsetWidth;pf.height=pf.offsetHeight;pts=Array.from({length:Math.min(90,Math.floor(pf.width/8))},()=>({x:Math.random()*pf.width,y:Math.random()*pf.height,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6}))}psz();addEventListener('resize',psz);
addEventListener('pointermove',e=>{const r=pf.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
(function pl(){pc.clearRect(0,0,pf.width,pf.height);
